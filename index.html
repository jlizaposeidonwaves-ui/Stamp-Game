<!DOCTYPE html>
<html>
<head>
<style>
body { margin:0; background:#000; font-family:monospace; color:#4aff4a; overflow:hidden; }
#bg { position:fixed; inset:0; background:url('bg.png') center/cover; }
#doc { position:fixed; bottom:15%; left:10%; width:350px; height:450px; background:#e8e0d0; color:#111; padding:30px; font-family:'Courier New',monospace; font-size:12px; box-shadow:0 20px 60px #000; cursor:crosshair; }
#term { position:fixed; left:35%; top:35%; width:30%; height:30%; background:#001a00; border:2px solid #0a3a0a; padding:10px; font-size:11px; overflow-y:auto; }
#input { position:fixed; left:35%; top:65%; width:30%; background:#001a00; border:none; color:#4aff4a; font-family:monospace; padding:5px; }
#stamps { position:fixed; bottom:5%; left:50%; transform:translateX(-50%); display:flex; gap:20px; }
.stamp { width:70px; height:70px; border-radius:50%; border:3px solid #444; background:#222; color:#666; cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:10px; }
.stamp:hover { border-color:#888; color:#aaa; }
.stamp.sel { border-color:#fff; color:#fff; box-shadow:0 0 20px rgba(255,255,255,0.3); }
#tray { position:fixed; top:10px; right:10px; width:200px; background:rgba(20,20,20,0.9); padding:10px; border-radius:5px; }
.folder { background:#c9b896; margin:5px 0; padding:8px; cursor:pointer; font-size:11px; color:#333; }
.folder:hover { background:#d9c8a6; }
.folder.done { opacity:0.4; text-decoration:line-through; }
#status { position:fixed; bottom:0; left:0; right:0; background:#111; padding:8px 20px; font-size:12px; color:#555; }
.mark { position:absolute; font-size:32px; font-weight:bold; padding:10px 20px; border:3px solid; transform:rotate(-12deg); opacity:0; pointer-events:none; text-transform:uppercase; }
.mark.show { animation:hit 0.4s forwards; }
@keyframes hit { 0%{opacity:0;transform:rotate(-12deg) scale(3);} 60%{opacity:1;transform:rotate(-12deg) scale(0.9);} 100%{opacity:0.9;transform:rotate(-12deg) scale(1);} }
#intro { position:fixed; inset:0; background:rgba(0,0,0,0.95); display:flex; align-items:center; justify-content:center; flex-direction:column; cursor:pointer; z-index:100; }
#intro h1 { font-size:60px; letter-spacing:15px; color:#e8e0d0; margin-bottom:20px; }
#intro p { color:#555; margin:5px; }
#end { position:fixed; inset:0; background:#000; display:none; align-items:center; justify-content:center; flex-direction:column; padding:40px; z-index:200; }
</style>
</head>
<body>
<div id="bg"></div>
<div id="intro" onclick="start()">
  <h1>STAMP</h1>
  <p>Municipal Police Department</p>
  <p>Records & Warrants Division</p>
  <p>Night Shift — Week 1, Day 1</p>
  <p style="margin-top:20px;color:#777">Click to begin. Read docs. Type LOOKUP [name] in terminal. Select stamp. Click doc to stamp.</p>
  <p style="color:#aaa;animation:hit 1s infinite">[ CLICK ]</p>
</div>
<div id="doc" style="display:none" onclick="stamp(event)"><div class="mark" id="mark"></div></div>
<div id="term" style="display:none"></div>
<input id="input" style="display:none" placeholder="APD> type here" onkeydown="if(event.key==='Enter')cmd(this.value);this.value=''">
<div id="stamps" style="display:none">
  <div class="stamp" onclick="pick('APPROVED',this)">APPROVE</div>
  <div class="stamp" onclick="pick('DENIED',this)">DENY</div>
  <div class="stamp" onclick="pick('FLAGGED',this)">FLAG</div>
</div>
<div id="tray" style="display:none"></div>
<div id="status" style="display:none"><span id="count">TRAY: 6</span> | <span id="flags">AUDIT: 0</span></div>
<div id="end"><h2 style="color:#e8e0d0;letter-spacing:5px">SHIFT COMPLETE</h2><div id="log" style="color:#777;max-width:500px"></div></div>

<script>
const docs=[
{t:'Warrant — Kowalski',c:'AF-2026-04471',o:'DET. R. MARTINEZ',s:'KOWALSKI, VINCENT',ch:'ARMED ROBBERY',j:'JUDGE H. PRESCOTT',ok:1,sig:1,pc:'CI #C-339 provided location. Subject wanted for armed robbery of Ashford Savings & Loan, 10/12/2026.',lk:{'KOWALSKI':'PRIOR: Burglary (2019), Assault (2021). ACTIVE WARRANT: Yes.','PRESCOTT':'Active bench. Signature verified.'},r:{a:[0,'Warrant executed. Subject in custody.'],d:[1,'Subject fled. Detective files complaint.'],f:[0,'Delayed 4 hours. Subject apprehended.']}},
{t:'Surveillance — 447 Maple',c:'AF-2026-04489',o:'DET. F. OKONKWO',s:'447 MAPLE ST, APT 3B',ch:'NARCOTICS',j:'JUDGE M. CALDWELL',ok:1,sig:0,pc:'Premises identified as distribution point. CI corroborates. 48-hour window requested.',lk:{'CALDWELL':'WARNING: Signature DOES NOT MATCH file.','447 MAPLE':'Registered: Kowalski, V. Also on lease: M. Chen, J. Doe.'},r:{a:[1,'No narcotics found. Defense alleges improper authorization.'],d:[0,'Returned for signature. Re-filed 48 hours later.'],f:[0,'Sent to Judge Caldwell. Signature confirmed.']}},
{t:'IA File — Morales',c:'IA-2026-00112',o:'LT. K. BRANDT, IA',s:'PERSONNEL: DET. S. MORALES',ch:'INTERNAL INVESTIGATION',j:'N/A',ok:1,sig:1,pc:'Request for complete personnel records of Det. S. Morales, Badge 8841. Clearance verified.',lk:{'MORALES':'14 years service. 7 commendations. 3 complaints (1 sustained). Spouse filed incident report 10/08.','BRANDT':'Internal Affairs. Badge 0007. Clearance: LEVEL 5.'},r:{a:[0,'File transmitted. Morales suspended pending review.'],d:[1,'IA subpoenas your records. Obstruction inquiry opened.'],f:[1,'Flagged. IA notes "uncooperative" in your file.']}},
{t:'Surveillance — Gazette',c:'AF-2026-04502',o:'DET. R. MARTINEZ',s:'ASHFORD GAZETTE NEWSROOM',ch:'OBSTRUCTION',j:'JUDGE H. PRESCOTT',ok:1,sig:1,pc:'Location believed to harbor source leaking investigation details. All paperwork in order.',lk:{'GAZETTE':'Local newspaper. Circulation 45,000. Recent articles on police conduct.'},r:{a:[1,'Source identified. Newspaper publishes exposé. Subpoena for YOUR records.'],d:[0,'Denied. Martinez notes "obstruction" in memo.'],f:[0,'Sent to DA. Request withdrawn quietly.']}},
{t:'Evidence — Firearm',c:'AF-2026-04471',o:'DET. F. OKONKWO',s:'.38 REVOLVER, SN 8841920',ch:'CHAIN OF CUSTODY',j:'N/A',ok:1,sig:1,pc:'Transfer to ballistics for testing. Chain of custody attached. Seal intact.',lk:{'8841920':'Reported stolen 09/28/2026, Ashford Heights.'},r:{a:[0,'Transferred. Ballistics match confirmed.'],d:[1,'Defense notes "procedural delay" in discovery.'],f:[0,'Held for review. Transferred next morning.']}},
{t:'Emergency — 221 Cedar Ln',c:'AF-2026-04511',o:'DET. S. MORALES',s:'PREMISES: 221 CEDAR LANE',ch:'KIDNAPPING',j:'JUDGE E. VANCE',ok:0,sig:1,pc:'Child, age 7, missing since 14:30. Vehicle seen at address. Owner has prior conviction. Urgent entry requested.',lk:{'VANCE':'NOT on emergency call rotation. On-call: Judge T. Huang.','CEDAR':'Registered: T. Briggs. PRIOR: Unlawful restraint (2018). Parole: Active.'},r:{a:[1,'Child not found. Homeowner files suit. Judge Vance NOT on call — warrant invalid.'],d:[1,'Child found elsewhere 20:00, unharmed. Department criticized for delay.'],f:[0,'Routed to Judge Huang. Approved 30 min later. Child recovered safely.']}}
];
let cur=0,done=0,flags=0,sel=null,log=[];
function start(){document.getElementById('intro').style.display='none';['doc','term','input','stamps','tray','status'].forEach(i=>document.getElementById(i).style.display='block');show(0);tray()}
function show(i){cur=i;const d=docs[i];document.getElementById('doc').innerHTML=`<div style="text-align:center;border-bottom:2px solid #111;padding-bottom:8px;margin-bottom:10px;font-weight:bold">${d.c}<br>MUNICIPAL POLICE DEPARTMENT<br>${d.t.split(' — ')[0].toUpperCase()}</div><div>OFFICER: ${d.o}</div><div>SUBJECT: ${d.s}</div><div>CHARGE: ${d.ch}</div><div>JUDGE: ${d.j}${d.sig?'':' (ILLEGIBLE)'}</div><div style="margin-top:10px;font-size:11px">${d.pc}</div><div style="margin-top:15px;display:flex;justify-content:space-between"><span style="border-top:1px solid #111;padding-top:2px;font-size:9px">${d.o}</span><span style="border-top:1px solid #111;padding-top:2px;font-size:9px">${d.j}</span></div><div class="mark" id="mark"></div>`}
function tray(){document.getElementById('tray').innerHTML=docs.map((d,i)=>`<div class="folder ${i===cur?'cur':''} ${d.done?'done':''}" onclick="if(!docs[${i}].done)show(${i})">${d.t}</div>`).join('')}
function pick(s,el){document.querySelectorAll('.stamp').forEach(e=>e.classList.remove('sel'));el.classList.add('sel');sel=s}
function stamp(e){if(!sel||docs[cur].done)return;const m=document.getElementById('mark');m.className='mark show '+sel.toLowerCase();m.textContent=sel;m.style.left=(e.offsetX-60)+'px';m.style.top=(e.offsetY-20)+'px';docs[cur].done=true;done++;const r=docs[cur].r[sel[0].toLowerCase()];if(r[0])flags++;log.push(`[${sel}] ${docs[cur].t}: ${r[1]}`);document.getElementById('flags').textContent='AUDIT: '+flags;document.getElementById('count').textContent='TRAY: '+(6-done);setTimeout(()=>{if(done>=6)end();else{let n=cur+1;while(n<6&&docs[n].done)n++;if(n<6)show(n)}tray()},800)}
function cmd(c){const t=document.getElementById('term');t.innerHTML+='<div style="color:#fff">> '+c+'</div>';const[a,...b]=c.split(' ');const q=b.join(' ').toUpperCase();let r='';if(a==='HELP')r='LOOKUP [name] | VERIFY [case] | JUDGES | TIME';else if(a==='JUDGES')r='PRESCOTT: on duty | CALDWELL: on duty | VANCE: NOT on call | HUANG: emergency';else if(a==='TIME')r='16:00';else if(a==='LOOKUP'){const d=docs[cur];for(const[k,v]of Object.entries(d.lk))if(q.includes(k)){r=v;break}if(!r)r='No records for: '+q}else if(a==='VERIFY'){const d=docs.find(x=>x.c===q);r=d?d.c+' — '+d.t:'Case not found'}else r='Unknown command. Type HELP.';t.innerHTML+='<div>'+r+'</div>';t.scrollTop=t.scrollHeight}
function end(){document.getElementById('doc').style.display='none';document.getElementById('term').style.display='none';document.getElementById('input').style.display='none';document.getElementById('stamps').style.display='none';document.getElementById('tray').style.display='none';document.getElementById('status').style.display='none';const e=document.getElementById('end');e.style.display='flex';document.getElementById('log').innerHTML=`<p>Processed: ${done} | Flags: ${flags}</p><p style="color:${flags>=3?'#f44':flags?'#fa0':'#4a4'};font-size:18px;margin:15px 0">${flags>=3?'REFERRED TO INTERNAL AFFAIRS':flags===2?'SUPERVISORY REVIEW':flags===1?'FLAGGED FOR FOLLOW-UP':'CLEAN AUDIT'}</p>`+log.map(l=>`<p style="font-size:11px;margin:4px 0">${l}</p>`).join('')}
</script>
</body>
</html>
